<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title description">
  <title id="title">Common Preprocessing and Three Analytical Pipelines</title>
  <desc id="description">Eight annual ATK Excel reports are inspected, profiled, integrated, cleaned and validated. The validated Common Dataset branches into Pipeline A for time trends, Pipeline B for municipalities and specialization, and Pipeline C for import dependency and structure.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#929aa3" stroke-width="1.25"/>
    </marker>
    <style>
      .box { fill: #f4f5f7; stroke: #d9dde3; stroke-width: 1.3; }
      .line { fill: none; stroke: #929aa3; stroke-width: 1.5; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #263341; text-anchor: middle; }
      .heading { font-weight: 600; }
    </style>
  </defs>
  <path class="line" d="M480 72 V100" marker-end="url(#arrow)"/>
  <path class="line" d="M480 182 V210" marker-end="url(#arrow)"/>
  <path class="line" d="M480 272 V310 H170 V340" marker-end="url(#arrow)"/>
  <path class="line" d="M480 310 V340" marker-end="url(#arrow)"/>
  <path class="line" d="M480 310 H790 V340" marker-end="url(#arrow)"/>
  <rect class="box" x="335" y="16" width="290" height="56" rx="16"/>
  <text class="label heading" x="480" y="49">Eight annual ATK Excel reports</text>
  <rect class="box" x="335" y="106" width="290" height="76" rx="16"/>
  <text class="label" x="480" y="132">
    <tspan class="heading" x="480">Common Preprocessing</tspan>
    <tspan x="480" dy="21">Inspect, profile, integrate,</tspan>
    <tspan x="480" dy="19">clean and validate</tspan>
  </text>
  <rect class="box" x="335" y="216" width="290" height="56" rx="16"/>
  <text class="label heading" x="480" y="249">Validated Common Dataset</text>
  <rect class="box" x="30" y="346" width="280" height="76" rx="16"/>
  <text class="label" x="170" y="377">
    <tspan class="heading" x="170">Pipeline A</tspan>
    <tspan x="170" dy="23">Trends over time</tspan>
  </text>
  <rect class="box" x="340" y="346" width="280" height="76" rx="16"/>
  <text class="label" x="480" y="377">
    <tspan class="heading" x="480">Pipeline B</tspan>
    <tspan x="480" dy="23">Municipalities and specialization</tspan>
  </text>
  <rect class="box" x="650" y="346" width="280" height="76" rx="16"/>
  <text class="label" x="790" y="377">
    <tspan class="heading" x="790">Pipeline C</tspan>
    <tspan x="790" dy="23">Import dependency and structure</tspan>
  </text>
</svg>
